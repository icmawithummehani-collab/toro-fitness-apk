name: Build Toro Fitness APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate Android/iOS platform folders
        run: |
          flutter create --org pk.torofitness --project-name toro_fitness --platforms=android,ios .
          rm -rf test
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="Toro Fitness"#' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
      - run: flutter pub get
      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: toro-fitness-apk
          path: build/app/outputs/flutter-apk/app-release.apk
